<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoLimite — Admin Key Gate</title>
  <style>
    :root {
      --bg: #090b10;
      --card: #111520;
      --input: #171d2c;
      --border: #252e46;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ADMIN KEY GATE */
    #gateScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .gate-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .gate-badge {
      display: inline-block;
      background: rgba(124, 58, 237, 0.16);
      color: #c4b5fd;
      border: 1px solid rgba(124, 58, 237, 0.35);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .gate-box h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .gate-box p { color: var(--muted); font-size: 0.88rem; margin-bottom: 22px; }

    /* MAIN SITE */
    #siteScreen {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .title-group { display: flex; align-items: center; gap: 10px; }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 20px;
    }
    @media (max-width: 840px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 14px; }

    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--input); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.14); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.32); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar input { margin-bottom: 0; max-width: 240px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }

    .key-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--input);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
    }
    .pill-used { background: rgba(16, 185, 129, 0.16); color: var(--green); }
    .pill-free { background: rgba(148, 163, 184, 0.16); color: var(--muted); }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--input);
      border: 1px solid var(--accent);
      padding: 11px 16px;
      border-radius: 10px;
      display: none;
      font-size: 0.88rem;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- PRIVATE ADMIN KEY ENTRY -->
  <div id="gateScreen">
    <div class="gate-box">
      <div class="gate-badge">PRIVATE ACCESS</div>
      <h1>🔑 Enter Admin Key</h1>
      <p>This website is private. Enter your Admin Key to access the key panel.</p>

      <label>Admin Key</label>
      <input
        type="password"
        id="adminKeyInput"
        placeholder="Default: ADMIN-2026"
        onkeydown="if(event.key==='Enter') enterWithAdminKey()"
      />

      <label>API Server URL (optional)</label>
      <input
        type="text"
        id="serverUrlInput"
        placeholder="Leave empty for browser storage"
      />

      <button class="btn-primary" onclick="enterWithAdminKey()">Enter Website</button>
    </div>
  </div>

  <!-- PROTECTED WEBSITE -->
  <div id="siteScreen">
    <header>
      <div class="title-group">
        <span class="status-dot"></span>
        <h1 style="font-size:1.15rem;">NoLimite Private Panel</h1>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost btn-sm" onclick="downloadKeys()">Export JSON</button>
        <button class="btn-ghost btn-sm" onclick="exitSite()">Lock</button>
      </div>
    </header>

    <div class="grid">
      <!-- CREATE -->
      <div class="card">
        <h2>Create Key</h2>
        <label>Prefix</label>
        <input type="text" id="keyPrefix" value="NoLimite" />

        <label>Duration</label>
        <select id="keyDuration">
          <option value="24h">24 Hours</option>
          <option value="7d">7 Days</option>
          <option value="30d" selected>30 Days</option>
          <option value="Lifetime">Lifetime</option>
        </select>

        <label>Max HWIDs</label>
        <select id="keyMaxUses">
          <option value="1" selected>1 PC</option>
          <option value="2">2 PCs</option>
          <option value="Global">Unlimited</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="keyCount" value="1" min="1" max="50" />

        <button class="btn-primary" onclick="generateKeys()">Generate</button>
      </div>

      <!-- MANAGE -->
      <div class="card">
        <div class="toolbar">
          <input type="text" id="filterInput" placeholder="Search key..." oninput="renderList()" />
          <button class="btn-danger btn-sm" onclick="wipeAll()">Delete All</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Key</th>
                <th>Duration</th>
                <th>Limit</th>
                <th>HWIDs</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="keysRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Change this to your own private Admin Key
    const REQUIRED_ADMIN_KEY = "ADMIN-2026";
    const STORE_KEY = "nolimite_admin_gate_keys_v1";

    let keysMap = {};
    let activeApiUrl = "";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2400);
    }

    function enterWithAdminKey() {
      const enteredKey = document.getElementById("adminKeyInput").value.trim();
      const urlVal = document.getElementById("serverUrlInput").value.trim().replace(/\/$/, "");

      if (!enteredKey || enteredKey !== REQUIRED_ADMIN_KEY) {
        return showToast("Invalid Admin Key");
      }

      activeApiUrl = urlVal;
      sessionStorage.setItem("nl_admin_auth", "1");
      sessionStorage.setItem("nl_admin_url", activeApiUrl);

      document.getElementById("gateScreen").style.display = "none";
      document.getElementById("siteScreen").style.display = "block";
      loadKeys();
    }

    function exitSite() {
      sessionStorage.removeItem("nl_admin_auth");
      document.getElementById("siteScreen").style.display = "none";
      document.getElementById("gateScreen").style.display = "flex";
      document.getElementById("adminKeyInput").value = "";
    }

    async function loadKeys() {
      if (activeApiUrl) {
        try {
          const res = await fetch(activeApiUrl + "/api/keys", {
            headers: { "Authorization": "Bearer " + REQUIRED_ADMIN_KEY }
          });
          if (res.ok) {
            const data = await res.json();
            keysMap = data.keys || {};
            renderList();
            return;
          }
        } catch (err) {
          showToast("Server unreachable, using local storage");
        }
      }

      try {
        keysMap = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      } catch {
        keysMap = {};
      }
      renderList();
    }

    function saveLocal() {
      localStorage.setItem(STORE_KEY, JSON.stringify(keysMap));
    }

    function randomKey(prefix) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let part = "";
      for (let i = 0; i < 6; i++) {
        part += chars[Math.floor(Math.random() * chars.length)];
      }
      return `${prefix || "NoLimite"}-${part}`;
    }

    function generateKeys() {
      const prefix = document.getElementById("keyPrefix").value.trim() || "NoLimite";
      const duration = document.getElementById("keyDuration").value;
      const max_uses = document.getElementById("keyMaxUses").value;
      const count = Math.min(Math.max(parseInt(document.getElementById("keyCount").value, 10) || 1, 1), 50);

      let latest = "";
      for (let i = 0; i < count; i++) {
        const k = randomKey(prefix);
        keysMap[k] = {
          duration,
          max_uses,
          hwid_list: [],
          created_at: new Date().toISOString().slice(0, 10)
        };
        latest = k;
      }

      saveLocal();
      renderList();

      if (count === 1 && latest) {
        navigator.clipboard?.writeText(latest);
        showToast("Created & copied: " + latest);
      } else {
        showToast(`Created ${count} keys`);
      }
    }

    function resetKeyHwid(k) {
      if (!keysMap[k]) return;
      keysMap[k].hwid_list = [];
      saveLocal();
      renderList();
      showToast("HWID reset: " + k);
    }

    function deleteOne(k) {
      delete keysMap[k];
      saveLocal();
      renderList();
      showToast("Deleted: " + k);
    }

    function wipeAll() {
      if (!confirm("Delete all keys?")) return;
      keysMap = {};
      saveLocal();
      renderList();
      showToast("All keys deleted");
    }

    function downloadKeys() {
      const blob = new Blob([JSON.stringify(keysMap, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nolimite-keys.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Exported nolimite-keys.json");
    }

    function renderList() {
      const q = document.getElementById("filterInput").value.toLowerCase();
      const rows = document.getElementById("keysRows");
      const items = Object.entries(keysMap).filter(([k]) => k.toLowerCase().includes(q));

      if (!items.length) {
        rows.innerHTML = '<tr><td colspan="5" style="color:var(--muted); text-align:center;">No keys found</td></tr>';
        return;
      }

      rows.innerHTML = items.map(([k, v]) => {
        const count = (v.hwid_list || []).length;
        return `
          <tr>
            <td><span class="key-badge" onclick="navigator.clipboard?.writeText('${k}'); showToast('Copied: ${k}')">${k}</span></td>
            <td>${v.duration}</td>
            <td>${v.max_uses}</td>
            <td><span class="pill ${count ? 'pill-used' : 'pill-free'}">${count} HWID</span></td>
            <td style="display:flex; gap:6px;">
              <button class="btn-ghost btn-sm" onclick="resetKeyHwid('${k}')">Reset</button>
              <button class="btn-danger btn-sm" onclick="deleteOne('${k}')">Delete</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    if (sessionStorage.getItem("nl_admin_auth") === "1") {
      activeApiUrl = sessionStorage.getItem("nl_admin_url") || "";
      document.getElementById("serverUrlInput").value = activeApiUrl;
      document.getElementById("gateScreen").style.display = "none";
      document.getElementById("siteScreen").style.display = "block";
      loadKeys();
    }
  </script>
</body>
</html>
